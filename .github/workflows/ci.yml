name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerflow_user
          POSTGRES_PASSWORD: ledgerflow_pass
          POSTGRES_DB: ledgerflow_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ledgerflow_user -d ledgerflow_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ledgerflow_user:ledgerflow_pass@localhost:5433/ledgerflow_test_db
      JWT_SECRET_KEY: ci-only-test-key-not-a-real-secret

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest -v